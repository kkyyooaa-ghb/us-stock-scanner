name: 美股掃描週報(校準版)

# V1.2.1(2026-07-27):校準樣本分代引擎統計；D8 只採 V1.2.0 R 樣本
# V1.2.0(2026-07-23):週報 Markdown/JSON + 每日 CSV 永久提交 reports/
# V1.1.0(2026-07-08):P1 track_performance 上線
# ═══════════════════════════════════════════════════════════════
# 每週日 13:00 UTC = 台北 21:00(台北無 DST,此換算恆定,單 cron 即可)
# 對齊台股「週日 21:00 校準提醒」節奏。
# 步驟順序:
#   1. track_performance.py — 回填 Notion 績效欄(掃描日收盤價/D+N報酬%/
#      R值/是否觸發停損);continue-on-error,回填失敗不擋週報
#   2. weekly_report.py — 彙總 + 📐 校準報告 + reports/永久檔
#   3. track_shadow_performance.py — 以永久 daily CSV 重算 V1.3 shadow 量尺
#   4. build_shadow_episodes.py — episode 去重、生命週期與樣本成熟度
#   5. commit reports/ — Markdown/JSON/每日 CSV/shadow 量尺成為 Git 可追溯資料
# 資料源:本 repo 的 scan-result artifacts(內建 GITHUB_TOKEN,actions:read,
#        不需任何新憑證)+ Notion 樣本計數與回填欄(同一組 secrets,失敗優雅)
# ═══════════════════════════════════════════════════════════════

on:
  # 正式排程由 cron-job.org 於每週日台北 21:00 觸發。
  # 保留 workflow_dispatch 供外部排程與人工補跑使用。
  workflow_dispatch:
    inputs:
      report_week_end:
        description: '指定完整週結束日(必須是週日 YYYY-MM-DD；留空取最近完整週)'
        type: string
        required: false
        default: ''

concurrency:
  group: repo-generated-writes
  cancel-in-progress: false

permissions:
  contents: write            # 永久提交 reports/週報與每日 CSV
  actions: read             # 讀取 artifacts 所需

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v6

      - name: 設定 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: P1 績效回填(track_performance)
        continue-on-error: true    # 回填失敗不擋週報(週報端讀不到會優雅跳過)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: python track_performance.py

      - name: 產出並推播週報
        env:
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}   # 內建,免設定
          NOTION_TOKEN:     ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID:     ${{ secrets.NOTION_DB_ID }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_WEEK_END:  ${{ inputs.report_week_end }}
        run: python weekly_report.py

      - name: V1.3 shadow 成交與 R 區間
        continue-on-error: true
        run: |
          shopt -s nullglob
          snapshots=(reports/daily/*.csv)
          if [ ${#snapshots[@]} -eq 0 ]; then
            echo "尚無 daily snapshots,跳過 V1.3 shadow 回填"
          else
            python track_shadow_performance.py "${snapshots[@]}" \
              --output reports/shadow_performance.csv
          fi

      - name: V1.3 episode 與成熟度報告
        continue-on-error: true
        run: |
          if [ -f reports/shadow_performance.csv ]; then
            python build_shadow_episodes.py reports/shadow_performance.csv \
              --episodes-output reports/shadow_episodes.csv \
              --summary-output reports/shadow_episode_summary.json \
              --markdown-output reports/shadow_episode_summary.md
          else
            echo "尚無 shadow performance,跳過 episode 報告"
          fi

      - name: 永久保存週報與每日 CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "reports 無變動,跳過 commit"
          else
            report_end=$(python -c "import json; print(json.load(open('reports/latest.json', encoding='utf-8'))['period']['end'])")
            git commit -m "report: weekly calibration ${report_end}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
