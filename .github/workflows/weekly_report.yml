name: 美股掃描週報(校準版)

# V1.2.0(2026-07-23):週報 Markdown/JSON + 每日 CSV 永久提交 reports/
# V1.1.0(2026-07-08):P1 track_performance 上線
# ═══════════════════════════════════════════════════════════════
# 每週日 13:00 UTC = 台北 21:00(台北無 DST,此換算恆定,單 cron 即可)
# 對齊台股「週日 21:00 校準提醒」節奏。
# 步驟順序:
#   1. track_performance.py — 回填 Notion 績效欄(掃描日收盤價/D+N報酬%/
#      R值/是否觸發停損);continue-on-error,回填失敗不擋週報
#   2. weekly_report.py — 彙總 + 📐 校準報告 + reports/永久檔
#   3. commit reports/ — Markdown/JSON/每日 CSV 成為 Git 可追溯資料
# 資料源:本 repo 的 scan-result artifacts(內建 GITHUB_TOKEN,actions:read,
#        不需任何新憑證)+ Notion 樣本計數與回填欄(同一組 secrets,失敗優雅)
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 13 * * 0'   # 週日 13:00 UTC = 台北 21:00(恆定)
  workflow_dispatch:
    inputs:
      report_week_end:
        description: '指定完整週結束日(必須是週日 YYYY-MM-DD；留空取最近完整週)'
        type: string
        required: false
        default: ''

concurrency:
  group: repo-generated-writes
  cancel-in-progress: false

permissions:
  contents: write            # 永久提交 reports/週報與每日 CSV
  actions: read             # 讀取 artifacts 所需

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v6

      - name: 設定 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: pip install pandas requests yfinance

      - name: P1 績效回填(track_performance)
        continue-on-error: true    # 回填失敗不擋週報(週報端讀不到會優雅跳過)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: python track_performance.py

      - name: 產出並推播週報
        env:
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}   # 內建,免設定
          NOTION_TOKEN:     ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID:     ${{ secrets.NOTION_DB_ID }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_WEEK_END:  ${{ inputs.report_week_end }}
        run: python weekly_report.py

      - name: 永久保存週報與每日 CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "reports 無變動,跳過 commit"
          else
            report_end=$(python -c "import json; print(json.load(open('reports/latest.json', encoding='utf-8'))['period']['end'])")
            git commit -m "report: weekly calibration ${report_end}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
